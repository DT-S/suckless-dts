name: Materialize tested dmenu

on:
  push:
    branches:
      - feat/suckless-refresh-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-dmenu-5-4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check materialization request
        id: request
        shell: bash
        run: |
          if [[ -f .materialize-dmenu-5.4 ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dmenu build dependencies
        if: steps.request.outputs.requested == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxft-dev \
            libxinerama-dev \
            libxrender-dev

      - name: Build the approved dmenu 5.4 source
        if: steps.request.outputs.requested == 'true'
        run: ./scripts/assemble-dmenu.sh

      - name: Replace dmenu with the tested source
        if: steps.request.outputs.requested == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dmenu
          cp -a build/dmenu/source dmenu
          rm -f .materialize-dmenu-5.4

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dmenu .materialize-dmenu-5.4
          git commit -m "refactor: materialize tested dmenu 5.4 source"
          git push origin HEAD:"${GITHUB_REF_NAME}"
