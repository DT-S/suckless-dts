name: Suckless build

on:
  push:
    branches:
      - feat/suckless-refresh-2026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dwm-6-8-patch-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxft-dev \
            libxinerama-dev \
            libxrender-dev

      - name: Assemble and build DWM 6.8 candidate
        run: ./scripts/assemble-dwm.sh

      - name: Upload candidate binary
        uses: actions/upload-artifact@v4
        with:
          name: dwm-6.8-candidate
          path: build/dwm/dwm
          if-no-files-found: error
