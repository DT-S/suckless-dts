name: Suckless build

on:
  push:
    branches:
      - feat/suckless-refresh-2026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dwm-6-8:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install X11 build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxft-dev \
            libxinerama-dev \
            libxrender-dev \
            x11-utils \
            xdotool \
            xvfb

      - name: Assemble and build DWM 6.8 candidate
        run: ./scripts/assemble-dwm.sh

      - name: Smoke-test DWM under Xvfb
        shell: bash
        run: |
          set -euo pipefail

          Xvfb :99 -ac -nolisten tcp -screen 0 1280x720x24 \
            > /tmp/dwm-xvfb.log 2>&1 &
          xvfb_pid=$!
          dwm_pid=""

          cleanup() {
            if [[ -n "$dwm_pid" ]]; then
              kill "$dwm_pid" 2>/dev/null || true
            fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          display_ready=0
          for _ in $(seq 1 50); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              display_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$display_ready" -ne 1 ]]; then
            cat /tmp/dwm-xvfb.log
            exit 1
          fi

          DISPLAY=:99 ./build/dwm/dwm > /tmp/dwm-smoke.log 2>&1 &
          dwm_pid=$!

          wm_ready=0
          for _ in $(seq 1 50); do
            if ! kill -0 "$dwm_pid" 2>/dev/null; then
              cat /tmp/dwm-smoke.log
              exit 1
            fi
            if DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null \
              | grep -q 'WINDOW'; then
              wm_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$wm_ready" -ne 1 ]]; then
            cat /tmp/dwm-smoke.log
            exit 1
          fi

          # Exercise the migrated Mod4/Super binding and the managed quit path.
          DISPLAY=:99 xdotool key --clearmodifiers super+shift+q

          stopped=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$dwm_pid" 2>/dev/null; then
              stopped=1
              break
            fi
            sleep 0.1
          done
          if [[ "$stopped" -ne 1 ]]; then
            cat /tmp/dwm-smoke.log
            exit 1
          fi

          wait "$dwm_pid"
          dwm_pid=""

      - name: Upload candidate binary and generated source
        uses: actions/upload-artifact@v4
        with:
          name: dwm-6.8-candidate
          path: |
            build/dwm/dwm
            build/dwm/source
          if-no-files-found: error
