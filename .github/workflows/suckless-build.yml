name: Suckless build

on:
  push:
    branches:
      - feat/suckless-refresh-2026
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dwm-6-8:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate port scripts
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done
          python3 -m py_compile scripts/port-dwm-6.8.py scripts/port-dwm-6.8-features.py

      - name: Install X11 build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxft-dev \
            libxinerama-dev \
            libxrender-dev \
            x11-utils \
            xdotool \
            xvfb

      - name: Assemble and build DWM 6.8 candidate
        run: ./scripts/assemble-dwm.sh

      - name: Smoke-test DWM under Xvfb
        shell: bash
        run: |
          set -euo pipefail

          Xvfb :99 -ac -nolisten tcp -screen 0 1280x720x24 \
            > /tmp/dwm-xvfb.log 2>&1 &
          xvfb_pid=$!
          dwm_pid=""

          cleanup() {
            if [[ -n "$dwm_pid" ]]; then
              kill "$dwm_pid" 2>/dev/null || true
            fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          display_ready=0
          for _ in $(seq 1 50); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then
              display_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$display_ready" -ne 1 ]]; then
            cat /tmp/dwm-xvfb.log
            exit 1
          fi

          DISPLAY=:99 ./build/dwm/dwm > /tmp/dwm-smoke.log 2>&1 &
          dwm_pid=$!

          wm_ready=0
          for _ in $(seq 1 50); do
            if ! kill -0 "$dwm_pid" 2>/dev/null; then
              cat /tmp/dwm-smoke.log
              exit 1
            fi
            if DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null \
              | grep -q 'WINDOW'; then
              wm_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$wm_ready" -ne 1 ]]; then
            cat /tmp/dwm-smoke.log
            exit 1
          fi

          DISPLAY=:99 xdotool key --clearmodifiers super+shift+q

          stopped=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$dwm_pid" 2>/dev/null; then
              stopped=1
              break
            fi
            sleep 0.1
          done
          if [[ "$stopped" -ne 1 ]]; then
            cat /tmp/dwm-smoke.log
            exit 1
          fi

          wait "$dwm_pid"
          dwm_pid=""

      - name: Upload DWM candidate binary and generated source
        uses: actions/upload-artifact@v4
        with:
          name: dwm-6.8-candidate
          path: |
            build/dwm/dwm
            build/dwm/source
          if-no-files-found: error

  st-0-9-3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done

      - name: Install ST build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxrender-dev \
            patch \
            x11-utils \
            xdotool \
            xvfb

      - name: Assemble and build ST 0.9.3 candidate
        run: ./scripts/assemble-st.sh

      - name: Smoke-test ST under Xvfb
        shell: bash
        run: |
          set -euo pipefail

          Xvfb :100 -ac -nolisten tcp -screen 0 1280x720x24 \
            > /tmp/st-xvfb.log 2>&1 &
          xvfb_pid=$!
          st_pid=""

          cleanup() {
            if [[ -n "$st_pid" ]]; then
              kill "$st_pid" 2>/dev/null || true
            fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          display_ready=0
          for _ in $(seq 1 50); do
            if DISPLAY=:100 xdpyinfo >/dev/null 2>&1; then
              display_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$display_ready" -ne 1 ]]; then
            cat /tmp/st-xvfb.log
            exit 1
          fi

          DISPLAY=:100 ./build/st/st -e /bin/sh -c \
            'printf "ST_SMOKE_OK\n"; sleep 30' \
            > /tmp/st-smoke.log 2>&1 &
          st_pid=$!

          window_ready=0
          for _ in $(seq 1 50); do
            if ! kill -0 "$st_pid" 2>/dev/null; then
              cat /tmp/st-smoke.log
              exit 1
            fi
            if DISPLAY=:100 xdotool search --pid "$st_pid" >/dev/null 2>&1; then
              window_ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$window_ready" -ne 1 ]]; then
            cat /tmp/st-smoke.log
            exit 1
          fi

          kill "$st_pid"
          wait "$st_pid" || true
          st_pid=""

      - name: Upload ST candidate binary, source and patches
        uses: actions/upload-artifact@v4
        with:
          name: st-0.9.3-candidate
          path: |
            build/st/st
            build/st/source
            build/st/patches
          if-no-files-found: error
